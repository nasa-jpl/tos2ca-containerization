name: Test Multiple Docker Builds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: data-driver
            dockerfile: ./Dockerfile_tos2ca_data_driver
            context: ./
          - image_name: fortracc-driver
            dockerfile: ./Dockerfile_tos2ca_fortracc_driver
            context: ./
          - image_name: auxgeoir-driver
            dockerfile: ./Dockerfile_tos2ca_auxgeoir_driver
            context: ./
          - image_name: interpolation-driver
            dockerfile: ./Dockerfile_tos2ca_interpolation_driver
            context: ./
          - image_name: plot-driver
            dockerfile: ./Dockerfile_tos2ca_plot_driver
            context: ./
          - image_name: stitching-driver
            dockerfile: ./Dockerfile_tos2ca_stitching_driver
            context: ./
          - image_name: data-driver-stationary
            dockerfile: ./Dockerfile_tos2ca_data_stationary_driver
            context: ./
          - image_name: interpolation-driver-stationary
            dockerfile: ./Dockerfile_tos2ca_interpolation_stationary_driver
            context: ./

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          # Tags help identify the image in the build logs
          tags: ${{ matrix.image_name }}:test