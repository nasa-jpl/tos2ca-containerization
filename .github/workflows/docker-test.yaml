build-test:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(needs.setup.outputs.dockerfiles) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Docker Tag
        id: prep
        run: |
          # Convert to lowercase and replace underscores with dashes for cleaner naming
          # This takes "Dockerfile_TOS2CA_Plot_Driver" and makes it "tos2ca-plot-driver"
          CLEAN_NAME=$(echo "${{ matrix.dockerfile }}" | tr '[:upper:]' '[:lower:]' | sed 's/dockerfile_//g' | sed 's/_/-/g')
          echo "tag=$CLEAN_NAME" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.dockerfile }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: false
          tags: tos2ca-${{ steps.prep.outputs.tag }}:test